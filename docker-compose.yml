services:
  postgres:
    image: postgres:18-alpine
    ports:
      - "${POSTGRES_PORT:-5434}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-applyflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-applyflow_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-applyflow}
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
